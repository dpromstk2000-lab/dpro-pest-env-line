name: DPRO 54 A4 Canonical DPRO SHOP URL Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dpro-54-a4-dproshop-url-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-54-a4-dproshop-url-fix
  cancel-in-progress: false

jobs:
  fix_a4_shop_url:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Drift guard
        shell: bash
        run: |
          set -euo pipefail
          echo "START_HEAD=$(git rev-parse HEAD)"
          test "$(git hash-object a4-flyer.html)" = "066d7caeaedd58ad095da945dcb43ba779f8147d"
          echo "A4_TARGET_DRIFT=NONE"

      - name: Add visible canonical DPRO SHOP URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("a4-flyer.html")
          s = p.read_text(encoding="utf-8")

          css_old = ".route p{font-size:2.35mm;color:#72827d;line-height:1.35;margin:0}"
          css_new = css_old + ".route .shop-url{display:block;margin-top:.7mm;font-size:2.15mm;line-height:1.1;color:#0d766b;font-weight:900;text-decoration:none;white-space:nowrap}"
          assert s.count(css_old) == 1
          s = s.replace(css_old, css_new, 1)

          old = '<div><small>02 / OFFICIAL</small><b>DPRO SHOP公式</b><p>サービス・料金を確認。</p></div>'
          new = '<div><small>02 / OFFICIAL</small><b>DPRO SHOP公式</b><p>サービス・料金を確認。</p><a class="shop-url" href="https://dpro-shop.com/" target="_blank" rel="noopener">https://dpro-shop.com/</a></div>'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          print("DPRO_SHOP_VISIBLE_URL=ADDED")
          PY

      - name: Blocking QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path("a4-flyer.html").read_text(encoding="utf-8")
          assert s.count('href="https://dpro-shop.com/"') == 1
          assert s.count('>https://dpro-shop.com/</a>') == 1
          assert '02 / OFFICIAL' in s
          assert 'DPRO SHOP公式' in s
          assert 'shop-url' in s
          print("A4_VISIBLE_CANONICAL_URL=PASS")
          print("A4_URL=https://dpro-shop.com/")
          PY
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO CENTRAL"
          git config user.email "actions@users.noreply.github.com"
          git add a4-flyer.html
          git commit -m "fix: show canonical DPRO SHOP URL on pest A4"
          git push origin HEAD:main

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/dpro-54-a4-dproshop-url-fix.yml
          git commit -m "chore: remove temporary DPRO 54 A4 URL fix workflow"
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "DPRO 54 A4 DPRO SHOP URL FIX=PASS"
          echo "VISIBLE_URL=https://dpro-shop.com/"
          echo "CORE_REBUILD=NONE"
