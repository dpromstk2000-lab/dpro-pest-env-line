name: DPRO PEST ENV Support Assets Normalize V1.2.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dpro-pest-env-support-assets-normalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move screenshots and generate QR assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p qa/support-sync-v1.2.2/screens
          mkdir -p qa/support-sync-v1.2.2/qr

          screens=(
            customer_target.png
            demo_prepare_target.png
            field_map_target.png
            guide.png
            inquiry_target.png
            mobile.png
            owner_board_target.png
            owner_target.png
            ready_target.png
            staff_target.png
            system_check_target.png
            target_missing_recovery.png
          )

          for f in "${screens[@]}"; do
            test -f "qa/$f"
            mv "qa/$f" "qa/support-sync-v1.2.2/screens/$f"
          done

          python -m pip install --quiet 'qrcode[pil]'
          python - <<'PY'
          from pathlib import Path
          import qrcode

          out = Path('qa/support-sync-v1.2.2/qr')
          out.mkdir(parents=True, exist_ok=True)

          urls = {
              'quick-1.png': 'https://dpromstk2000-lab.github.io/dpro-pest-env-line/guide-center.html',
              'quick-2.png': 'https://dpromstk2000-lab.github.io/dpro-pest-env-line/tutorial.html?mode=start&demo=1',
              'quick-3.png': 'https://dpromstk2000-lab.github.io/dpro-pest-env-line/system-check.html?demo=1',
              'detail-1.png': 'https://dpromstk2000-lab.github.io/dpro-pest-env-line/guide-center.html',
              'detail-2.png': 'https://dpromstk2000-lab.github.io/dpro-pest-env-line/tutorial.html?mode=start&demo=1',
              'detail-3.png': 'https://dpromstk2000-lab.github.io/dpro-pest-env-line/demo-prepare.html?demo=1',
              'detail-4.png': 'https://dpromstk2000-lab.github.io/dpro-pest-env-line/owner.html?demo=1',
              'detail-5.png': 'https://dpromstk2000-lab.github.io/dpro-pest-env-line/staff.html?demo=1',
              'detail-6.png': 'https://dpromstk2000-lab.github.io/dpro-pest-env-line/owner-ipad.html?demo=1',
              'detail-7.png': 'https://dpromstk2000-lab.github.io/dpro-pest-env-line/system-check.html?demo=1',
              'detail-8.png': 'https://dpromstk2000-lab.github.io/dpro-pest-env-line/ready-control-center.html',
              'detail-9.png': 'https://dpromstk2000-lab.github.io/dpro-pest-env-line/guide-center.html',
              'detail-10.png': 'https://dpromstk2000-lab.github.io/dpro-pest-env-line/DPRO_PEST_ENV_DETAILED_MANUAL_FINAL_V1.2.2.pdf',
          }

          for name, url in urls.items():
              qr = qrcode.QRCode(version=None, error_correction=qrcode.constants.ERROR_CORRECT_M, box_size=10, border=4)
              qr.add_data(url)
              qr.make(fit=True)
              qr.make_image(fill_color='black', back_color='white').save(out / name)
          PY

          test "$(find qa/support-sync-v1.2.2/screens -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "12"
          test "$(find qa/support-sync-v1.2.2/qr -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "13"

          for f in "${screens[@]}"; do
            test ! -e "qa/$f"
          done

          rm -f .github/workflows/dpro-pest-env-support-assets-normalize.yml

      - name: Commit normalized support assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Support QA Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "qa: normalize PEST ENV Support V1.2.2 assets"
          git push origin HEAD:main
