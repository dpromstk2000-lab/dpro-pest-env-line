            {step_id:'pest-first10-03-web-inquiry',order:3,title:'WEB相談受付',route:'inquiry.html?demo=1',selector:'#form'},
            {step_id:'pest-first10-04-customer',order:4,title:'Customer',route:'customer.html?demo=1',selector:'#detail > h2'},
            {step_id:'pest-first10-05-owner-case-board',order:5,title:'Owner - 案件ボード',route:'owner.html?demo=1',selector:'.open'},
            {step_id:'pest-first10-06-owner-next-action',order:6,title:'Owner - Next Actionと状態確認',route:'owner.html?demo=1',selector:'#detail .grid > div:nth-child(2)'},
            {step_id:'pest-first10-07-staff-field-record',order:7,title:'Staff - 現場カルテ',route:'staff.html?demo=1',selector:'#phase'},
            {step_id:'pest-first10-08-field-map-trap',order:8,title:'Field Map / Trap PIN',route:'owner-ipad.html?demo=1',selector:'#app > section.card h2'},
            {step_id:'pest-first10-09-system-check',order:9,title:'System Check',route:'system-check.html?demo=1',selector:'#run'},
            {step_id:'pest-first10-10-ready',order:10,title:'READYと契約後設定',route:'ready-control-center.html',selector:'.hero h1'}
          ];
          const viewports=[
            {name:'mobile-375',width:375,height:812},{name:'mobile-390',width:390,height:844},{name:'mobile-430',width:430,height:932},{name:'tablet-768',width:768,height:1024},{name:'desktop-1440',width:1440,height:1000}
          ];
          const allMutations=[],allFailed=[],allConsole=[],allPageErrors=[];
          function tracker(page,label){
            const t={label,mutations:[],failed:[],console:[],pageErrors:[]};
            page.on('request',r=>{if(['POST','PATCH','DELETE'].includes(r.method())){const x={label,method:r.method(),url:r.url()};t.mutations.push(x);allMutations.push(x)}});
            page.on('requestfailed',r=>{const x={label,url:r.url(),method:r.method(),error:r.failure()?.errorText||''};t.failed.push(x);allFailed.push(x)});
            page.on('console',m=>{if(m.type()==='error'){const x={label,text:m.text()};t.console.push(x);allConsole.push(x)}});
            page.on('pageerror',e=>{const x={label,text:String(e)};t.pageErrors.push(x);allPageErrors.push(x)});
            return t;
          }
          async function bootstrap(context){const p=await context.newPage();await p.goto(BASE+'customer.html?demo=1',{waitUntil:'domcontentloaded',timeout:45000});await p.waitForTimeout(250);const b=await p.evaluate(k=>localStorage.getItem(k),BUSINESS);await p.close();if(!b)throw new Error('DEMO_BOOTSTRAP_MISSING');return b;}
          async function waitReady(page,index){await page.waitForFunction(([i])=>{const c=document.querySelector('#counter')?.textContent?.trim();const s=document.querySelector('#targetStatus');return c===`${i+1} / 10`&&s?.dataset.state==='ready'&&window.DPRO_TUTORIAL_NAV_V122?.getSnapshot?.().index===i},[index],{timeout:20000});}
          function expectedAbs(step){return new URL(step.route,BASE).href}
          async function verifyStep(page,index){
            const step=steps[index]; const snap=await page.evaluate(()=>window.DPRO_TUTORIAL_NAV_V122.getSnapshot());
            if(snap.index!==index||snap.targetState!=='ready'||(snap.step?.step_id??snap.step?.id)!==step.step_id)throw new Error(`SNAPSHOT_MISMATCH_${index+1}`);
            const exp=new URL(expectedAbs(step)),act=new URL(snap.lastActualUrl); if(exp.pathname!==act.pathname||exp.search!==act.search)throw new Error(`WRONG_ROUTE_${index+1}_${act.pathname}${act.search}`);
            const child=page.frames().find(f=>f!==page.mainFrame()&&new URL(f.url()).pathname===exp.pathname&&new URL(f.url()).search===exp.search);if(!child)throw new Error(`FRAME_NOT_FOUND_${index+1}`);
            const result=await child.locator(step.selector).first().evaluate(el=>{const r=el.getBoundingClientRect(),cs=getComputedStyle(el);return {active:el.getAttribute('data-dpro-tutorial-active')==='true',outlineWidth:parseFloat(cs.outlineWidth)||0,left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height,innerWidth:innerWidth,innerHeight:innerHeight,overflow:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0)-innerWidth}});
            if(!result.active||result.outlineWidth<3)throw new Error(`HIGHLIGHT_FAIL_${index+1}`);if(result.bottom<=0||result.top>=result.innerHeight||result.right<=0||result.left>=result.innerWidth)throw new Error(`TARGET_NOT_VISIBLE_${index+1}`);if(result.overflow>1)throw new Error(`FRAME_HORIZONTAL_OVERFLOW_${index+1}_${result.overflow}`);
            const parent=await page.evaluate(()=>({overflow:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0)-innerWidth}));if(parent.overflow>1)throw new Error(`PARENT_HORIZONTAL_OVERFLOW_${index+1}_${parent.overflow}`);
            const frameBox=await page.locator('#targetFrame').boundingBox(),cardBox=await page.locator('#tutorialCard').boundingBox();if(!frameBox||!cardBox)throw new Error('LAYOUT_BOX_MISSING');const targetBox={x:frameBox.x+result.left,y:frameBox.y+result.top,width:result.width,height:result.height};const overlap=Math.max(0,Math.min(targetBox.x+targetBox.width,cardBox.x+cardBox.width)-Math.max(targetBox.x,cardBox.x))*Math.max(0,Math.min(targetBox.y+targetBox.height,cardBox.y+cardBox.height)-Math.max(targetBox.y,cardBox.y));if(overlap>1)throw new Error(`CARD_COVERS_TARGET_${index+1}_${overlap}`);
            return {index,step_id:step.step_id,route_ok:true,target_ok:true,target_visible:true,highlight_visible:true,parent_overflow:parent.overflow,frame_overflow:result.overflow,card_target_overlap:overlap,target_projected_box:targetBox};
          }
          async function runViewport(browser,vp){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});const before=await bootstrap(context);const page=await context.newPage();const tr=tracker(page,vp.name);await page.goto(BASE+'tutorial.html?mode=start&demo=1&qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});const rows=[];
            for(let i=0;i<10;i++){await waitReady(page,i);rows.push(await verifyStep(page,i));if(vp.name==='desktop-1440'&&[0,1,2,5,6,7,8,9].includes(i)){const names={0:'desktop-step-01.png',1:'desktop-step-02-demo-prepare-target.png',2:'desktop-step-03-inquiry-target.png',5:'desktop-step-06-owner-target.png',6:'desktop-step-07-staff-target.png',7:'desktop-step-08-field-map-target.png',8:'desktop-step-09-system-check-target.png',9:'desktop-step-10-ready-target.png'};await page.screenshot({path:path.join(SHOTS,names[i]),fullPage:true})}if(vp.name==='mobile-390'&&i===0)await page.screenshot({path:path.join(SHOTS,'mobile-step-01.png'),fullPage:true});if(vp.name==='mobile-390'&&i===7)await page.screenshot({path:path.join(SHOTS,'mobile-cross-page-target.png'),fullPage:true});if(i<9){await page.locator('#next').click();}}
            await page.locator('#next').click();const completed=await page.evaluate(()=>window.DPRO_TUTORIAL_NAV_V122.getSnapshot().completed);if(!completed)throw new Error(`COMPLETE_FAIL_${vp.name}`);const after=await page.evaluate(k=>localStorage.getItem(k),BUSINESS);if(before!==after)throw new Error(`BUSINESS_STORAGE_CHANGED_${vp.name}`);if(tr.mutations.length||tr.failed.length||tr.console.length||tr.pageErrors.length)throw new Error(`RUNTIME_ERRORS_${vp.name}`);await context.close();return {viewport:vp,steps:rows,completed:true,business_storage_unchanged:true,mutation_count:0,request_error_count:0,console_error_count:0,page_error_count:0};
          }
          async function featureTests(browser){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});const before=await bootstrap(context);const page=await context.newPage();const tr=tracker(page,'feature-tests');await page.goto(BASE+'tutorial.html?mode=start&demo=1&qa=features',{waitUntil:'domcontentloaded',timeout:45000});await waitReady(page,0);
            await page.locator('#start').focus();const focusOutline=await page.locator('#start').evaluate(el=>({id:document.activeElement.id,outline:parseFloat(getComputedStyle(el).outlineWidth)||0}));if(focusOutline.id!=='start'||focusOutline.outline<3)throw new Error('FOCUS_VISIBLE_FAIL');await page.keyboard.press('Enter');await waitReady(page,0);
            await page.locator('#next').focus();await page.keyboard.press('Space');await waitReady(page,1);await page.locator('#back').click();await waitReady(page,0);
            for(let i=0;i<5;i++){await page.locator('#next').click();await waitReady(page,i+1)}
            await page.locator('#back').click();await waitReady(page,4);await page.locator('#next').click();await waitReady(page,5);
            await page.locator('#close').click();let s=await page.evaluate(()=>window.DPRO_TUTORIAL_NAV_V122.getSnapshot());if(!s.closed||s.index!==5)throw new Error('CLOSE_PRESERVE_FAIL');await page.locator('#resume').click();await waitReady(page,5);
            await page.keyboard.press('Escape');s=await page.evaluate(()=>window.DPRO_TUTORIAL_NAV_V122.getSnapshot());if(!s.closed||s.index!==5)throw new Error('ESC_PRESERVE_FAIL');await page.locator('#resume').click();await waitReady(page,5);
            await page.locator('#replay').click();await waitReady(page,0);s=await page.evaluate(()=>window.DPRO_TUTORIAL_NAV_V122.getSnapshot());if(s.index!==0||s.completed)throw new Error('REPLAY_FAIL');const after=await page.evaluate(k=>localStorage.getItem(k),BUSINESS);if(before!==after)throw new Error('REPLAY_CLEARED_BUSINESS_DATA');
            const focusSeen=[];for(let i=0;i<14;i++){await page.keyboard.press('Tab');focusSeen.push(await page.evaluate(()=>document.activeElement?.id||document.activeElement?.tagName||''))}if(new Set(focusSeen.filter(Boolean)).size<3)throw new Error('BAD_FOCUS_TRAP');if(tr.mutations.length||tr.failed.length||tr.console.length||tr.pageErrors.length)throw new Error('FEATURE_RUNTIME_ERRORS');await context.close();return {start:true,next_space:true,back:true,resume_exact:true,replay:true,close_preserves:true,esc_preserves:true,focus_visible:true,tab_usable:true,enter_space_usable:true,no_bad_focus_trap:true,business_storage_unchanged:true};
          }
          async function guideTests(browser){
            const context=await browser.newContext({viewport:{width:1280,height:900}});const before=await bootstrap(context);const page=await context.newPage();const tr=tracker(page,'guide-tests');
            await page.goto(BASE+'guide-center.html?qa=guide',{waitUntil:'domcontentloaded',timeout:45000});for(const id of ['startFirst10','resumeFirst10','replayFirst10'])if(await page.locator('#'+id).count()!==1)throw new Error('GUIDE_ID_MISSING_'+id);
            await page.locator('#startFirst10').click();await page.waitForURL(/tutorial\.html\?mode=start/);await waitReady(page,0);
            await page.goto(BASE+'guide-center.html?qa=resume',{waitUntil:'domcontentloaded'});await page.evaluate(k=>localStorage.setItem(k,JSON.stringify({index:5,completed:false,closed:true})),KEY);await page.locator('#resumeFirst10').click();await page.waitForURL(/tutorial\.html\?mode=resume/);await waitReady(page,5);
            await page.goto(BASE+'guide-center.html?qa=replay',{waitUntil:'domcontentloaded'});await page.evaluate(k=>localStorage.setItem(k,JSON.stringify({index:8,completed:false,closed:false})),KEY);await page.locator('#replayFirst10').click();await page.waitForURL(/tutorial\.html\?mode=replay/);await waitReady(page,0);const afterReplay=await page.evaluate(k=>localStorage.getItem(k),BUSINESS);if(before!==afterReplay)throw new Error('GUIDE_REPLAY_BUSINESS_CHANGE');
            await page.goto(BASE+'guide-center.html?qa=progress',{waitUntil:'domcontentloaded'});await page.evaluate(k=>localStorage.setItem(k,JSON.stringify({index:4,completed:false,closed:false})),KEY);await page.reload({waitUntil:'domcontentloaded'});const progress=(await page.locator('#progress').innerText()).replace(/\s+/g,' ');if(!progress.includes('STEP 5 / 10'))throw new Error('GUIDE_PROGRESS_FAIL_'+progress);if(tr.mutations.length||tr.failed.length||tr.console.length||tr.pageErrors.length)throw new Error('GUIDE_RUNTIME_ERRORS');await context.close();return {start_click:'PASS',resume_click:'PASS',replay_click:'PASS',progress_display:'PASS',business_storage_unchanged:true};
          }
          async function missingTest(browser){
            const context=await browser.newContext({viewport:{width:1280,height:900}});const before=await bootstrap(context);const page=await context.newPage();const tr=tracker(page,'target-missing');await page.route('**/guide-center.html',async route=>{if(route.request().resourceType()==='document'){await route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:'<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>QA missing target</title></head><body><section class="hero"><h1>QA missing target</h1></section></body></html>'})}else await route.continue()});await page.goto(BASE+'tutorial.html?mode=start&demo=1&qa=missing',{waitUntil:'domcontentloaded',timeout:45000});await page.waitForFunction(()=>document.querySelector('#targetStatus')?.dataset.state==='error',{timeout:15000});const snap=await page.evaluate(()=>window.DPRO_TUTORIAL_NAV_V122.getSnapshot());const nextDisabled=await page.locator('#next').isDisabled(),retry=await page.locator('#retry').isVisible(),guide=await page.locator('#guideRecovery').isVisible(),msg=await page.locator('#targetStatus').innerText();if(snap.index!==0||!nextDisabled||!retry||!guide||!msg.includes('TARGET_MISSING'))throw new Error('TARGET_MISSING_CONTRACT_FAIL');await page.screenshot({path:path.join(SHOTS,'TARGET_MISSING-recovery.png'),fullPage:true});await page.locator('#next').click({force:true}).catch(()=>{});const still=await page.evaluate(()=>window.DPRO_TUTORIAL_NAV_V122.getSnapshot().index);if(still!==0)throw new Error('REQUIRED_TARGET_BYPASS');await page.unroute('**/guide-center.html');await page.locator('#retry').click();await waitReady(page,0);const after=await page.evaluate(k=>localStorage.getItem(k),BUSINESS);if(before!==after)throw new Error('MISSING_TEST_BUSINESS_CHANGE');if(tr.mutations.length||tr.failed.length||tr.console.length||tr.pageErrors.length)throw new Error('MISSING_RUNTIME_ERRORS');await context.close();return {blocks_progress:true,japanese_error:true,retry:true,guide_recovery:true,no_silent_fallback:true,recovered_after_retry:true,required_target_bypass_count:0};
