      - name: Setup Playwright
        if: steps.bootstrap.outputs.bootstrapped != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser QA dependencies
        if: steps.bootstrap.outputs.bootstrapped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pest-v122 && cd /tmp/pest-v122
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for exact source Pages deployment
        if: steps.bootstrap.outputs.bootstrapped != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker=0; pages_run=0; pages_id=''; pages_url=''
          for i in $(seq 1 60); do
            html="$(curl -fsSL -H 'Cache-Control: no-cache' "${PUBLIC_BASE}tutorial.html?src=${GITHUB_SHA:0:12}&t=$RANDOM" || true)"
            guide="$(curl -fsSL -H 'Cache-Control: no-cache' "${PUBLIC_BASE}guide-center.html?src=${GITHUB_SHA:0:12}&t=$RANDOM" || true)"
            if grep -q 'DPRO_TUTORIAL_NAVIGATION_V1.2.2' <<<"$html" && grep -q 'startFirst10' <<<"$guide" && grep -q 'replayFirst10' <<<"$guide"; then marker=1; fi
            runs="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" || echo '{"workflow_runs":[]}')"
            pages_id="$(jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[]|select(.head_sha==$sha and .name=="pages build and deployment" and .conclusion=="success")][0].id // empty' <<<"$runs")"
            pages_url="$(jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[]|select(.head_sha==$sha and .name=="pages build and deployment" and .conclusion=="success")][0].html_url // empty' <<<"$runs")"
            [[ -n "$pages_id" ]] && pages_run=1 || true
            if [[ "$marker" == 1 && "$pages_run" == 1 ]]; then break; fi
            sleep 5
          done
          cat > "$OUT_DIR/PAGES_SOURCE_PRECHECK.txt" <<TXT
          SOURCE_HEAD=$GITHUB_SHA
          PUBLIC_MARKER=$marker
          PAGES_SUCCESS=$pages_run
          PAGES_RUN_ID=$pages_id
          PAGES_RUN_URL=$pages_url
          PUBLIC_TUTORIAL=${PUBLIC_BASE}tutorial.html
          PUBLIC_GUIDE=${PUBLIC_BASE}guide-center.html
          TXT
          [[ "$marker" == 1 && "$pages_run" == 1 ]]

      - name: Run Tutorial Navigation V1.2.2 browser QA
        if: steps.bootstrap.outputs.bootstrapped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pest-v122
          cat > qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          const BASE=process.env.PUBLIC_BASE;
