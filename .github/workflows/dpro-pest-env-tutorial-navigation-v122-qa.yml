name: DPRO PEST ENV Tutorial Navigation V1.2.2 QA
# QA_FIX_V1.1: measure tutorial-card overlap against the highlighted target, not the whole target pane.

on:
  push:
    branches: [main]
    paths:
      - 'tutorial.html'
      - 'guide-center.html'
      - '.github/workflows/dpro-pest-env-tutorial-navigation-v122-qa.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: dpro-pest-env-tutorial-navigation-v122
  cancel-in-progress: false

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASELINE_HEAD: 63eea528be323427be15faa3a6b99af41a1b39d9
      PUBLIC_BASE: https://dpromstk2000-lab.github.io/dpro-pest-env-line/
      OUT_DIR: qa/tutorial-navigation-v1.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Bootstrap V1.2.2 source when connector is read-only
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'DPRO_TUTORIAL_NAVIGATION_V1.2.2' tutorial.html 2>/dev/null && grep -q 'id="startFirst10"' guide-center.html 2>/dev/null && grep -q 'id="replayFirst10"' guide-center.html 2>/dev/null; then
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            echo "SOURCE_ALREADY_RETROFITTED=YES"
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only "$BASELINE_HEAD..HEAD")
          for f in "${changed[@]}"; do
            [[ "$f" == '.github/workflows/dpro-pest-env-tutorial-navigation-v122-qa.yml' ]] || { echo "DRIFT_BEFORE_BOOTSTRAP=$f" >&2; exit 1; }
