<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer | DPRO PEST</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar"><div class="brand">Customer</div><div id="nav"></div></div><div class="demo-banner">DEMO — 顧客本人の案件だけを表示</div><main class="container" id="app"></main><script src="demo-core.js"></script><script src="ui.js"></script><script>if(DPRO_UI.requireDemo()){document.getElementById('nav').innerHTML=DPRO_UI.nav();const state=DproDemo.load();const uid='u-customer-home';const cases=DproDemo.visibleCases(state,uid);const c=cases[0];const ev=state.evidence.filter(e=>e.caseId===c.id);document.getElementById('app').innerHTML=`<section class="hero"><span class="badge">受付番号 ${DPRO_UI.esc(c.id)}</span><h1>${DPRO_UI.esc(c.title)}</h1><div class="row"><span class="status ${c.urgency==='high'?'urgent':''}">${DPRO_UI.status(c.status)}</span><span>次回: ${DPRO_UI.fmt(c.nextVisit)}</span></div></section><div class="split" style="margin-top:18px"><section class="card"><h2>案件状況</h2><p>現在は <b>${DPRO_UI.status(c.status)}</b> です。</p><div class="notice">危険を感じる場合や、ハチの大群・咬傷/刺傷・動物との接触など緊急性がある場合は、画面入力だけに頼らず電話・医療/行政等の適切な窓口を利用してください。</div><h3>相談内容を追加</h3><div class="field"><label>写真メモ</label><input id="caption" placeholder="例：シンク下で目撃"></div><button class="btn" id="add">相談写真メモを追加</button></section><section class="card"><h2>Evidence Chain</h2><div class="timeline" id="timeline">${ev.map(e=>`<div class="event"><b>${DPRO_UI.esc(e.phase)}</b><div>${DPRO_UI.esc(e.caption)}</div><small>${DPRO_UI.fmt(e.createdAt)}</small></div>`).join('')}</div></section></div>`;document.getElementById('add').onclick=()=>{const s=DproDemo.load();DproDemo.addEvidence(s,uid,c.id,{phase:'inquiry',caption:document.getElementById('caption').value||'追加相談（デモ）'});DproDemo.save(s);location.reload();};}</script></body></html>
