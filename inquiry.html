<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>害虫・害獣相談 | DPRO</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar"><div class="brand">相談受付</div></div><main class="container"><section class="hero"><h1>まず、状況を教えてください</h1><p>対象が分からなくても大丈夫です。目撃場所・症状・写真など、分かる範囲から送れます。</p></section><form class="card" id="form" style="margin-top:18px"><div class="field"><label>お名前</label><input name="customer_name" required></div><div class="field"><label>電話 / 連絡先</label><input name="contact" required></div><div class="field"><label>場所</label><select name="property_kind"><option value="house">住宅</option><option value="restaurant">飲食店</option><option value="facility">施設</option><option value="property">管理物件</option></select></div><div class="field"><label>症状・目撃場所</label><textarea name="symptom" rows="5" required></textarea></div><div class="field"><label>写真（G4/G5デモでは端末内プレビューのみ。本番Storage接続後に送信有効化）</label><input id="photos" type="file" accept="image/*" multiple></div><div id="preview" class="row"></div><label><input type="checkbox" required> 緊急危険時はこのフォームだけに頼らず、電話・医療・行政等の適切な窓口を利用することを確認しました。</label><br><br><button class="btn" type="submit">相談を送る</button><p id="msg"></p></form></main><script src="config.js"></script><script>const q=new URLSearchParams(location.search),demo=q.get('demo')==='1';document.getElementById('photos').onchange=e=>{document.getElementById('preview').textContent=`${e.target.files.length}枚選択`};document.getElementById('form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),body=Object.fromEntries(fd.entries());body.urgency_hint='unknown';body.photos=[...document.getElementById('photos').files].map(f=>({name:f.name,size:f.size,type:f.type}));if(demo){document.getElementById('msg').textContent='DEMO受付完了（本番送信なし）';return}if(!window.DPRO_CONFIG.apiBase){document.getElementById('msg').textContent='現在は導入設定前です。事業者へ電話等でお問い合わせください。';return}try{const r=await fetch(DPRO_CONFIG.apiBase+'/api/pest/v1/inquiries',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();document.getElementById('msg').textContent=r.ok?'受付しました':'送信できませんでした: '+(j.error?.message||'エラー')}catch{document.getElementById('msg').textContent='通信できませんでした。時間をおいて再度お試しください。'}};</script></body></html>
