<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>害虫・害獣相談 | DPRO</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar"><div class="brand">相談受付</div></div><main class="container"><section class="hero"><span class="badge">WEB / LINE READY</span><h1>まず、状況を教えてください</h1><p>対象が分からなくても大丈夫です。目撃場所・症状・写真など、分かる範囲から送れます。</p></section><form class="card" id="form" style="margin-top:18px"><div class="field"><label>お名前</label><input name="customer_name" required></div><div class="field"><label>電話 / 連絡先</label><input name="contact" required></div><div class="field"><label>場所</label><select name="property_kind"><option value="house">住宅</option><option value="restaurant">飲食店</option><option value="facility">施設</option><option value="property">管理物件</option><option value="other">その他</option></select></div><div class="field"><label>症状・目撃場所</label><textarea name="symptom" rows="5" required></textarea></div><div class="field"><label>写真・PDF（最大5件／1件10MB以下）</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple></div><div id="preview" class="muted"></div><label><input type="checkbox" required> 緊急危険時はこのフォームだけに頼らず、電話・医療・行政等の適切な窓口を利用することを確認しました。</label><br><br><button class="btn" id="submit" type="submit">相談を送る</button><p id="msg"></p></form></main><script src="config.js"></script><script>
const q=new URLSearchParams(location.search),demo=q.get('demo')==='1',source=q.get('source')==='line'?'line_liff':'web',photos=document.getElementById('photos'),preview=document.getElementById('preview'),msg=document.getElementById('msg'),submit=document.getElementById('submit');
photos.onchange=()=>{const fs=[...photos.files],bytes=fs.reduce((n,f)=>n+f.size,0);preview.textContent=`${fs.length}件選択 / 合計 ${(bytes/1024/1024).toFixed(1)}MB`;if(fs.length>5)msg.textContent='写真・PDFは5件までです。'};
document.getElementById('form').onsubmit=async e=>{e.preventDefault();msg.textContent='';const fs=[...photos.files];if(fs.length>5){msg.textContent='写真・PDFは5件までです。';return}if(fs.some(f=>f.size>10*1024*1024)){msg.textContent='1件10MB以下にしてください。';return}if(demo){msg.textContent='DEMO受付完了（本番送信なし）';return}if(!window.DPRO_CONFIG.apiBase){msg.textContent='現在は導入設定前です。事業者へ電話等でお問い合わせください。';return}const fd=new FormData(e.currentTarget);fd.set('urgency_hint','unknown');fd.set('source',source);fd.delete('photos');fs.forEach(f=>fd.append('photos',f,f.name));submit.disabled=true;submit.textContent='送信中…';try{const r=await fetch(DPRO_CONFIG.apiBase+'/api/pest/v1/inquiries',{method:'POST',body:fd});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error?.message||`HTTP ${r.status}`);msg.textContent=`受付しました。受付番号: ${String(j.inquiry?.id||'').slice(0,8)} / 添付 ${j.attachments_count||0}件`;e.currentTarget.reset();preview.textContent=''}catch(err){msg.textContent='送信できませんでした: '+err.message}finally{submit.disabled=false;submit.textContent='相談を送る'}};
</script></body></html>
