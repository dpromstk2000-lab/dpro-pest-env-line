<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPad Field Map | DPRO PEST</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar"><div class="brand">iPad / Property Map</div><div id="nav"></div></div><div class="demo-banner">DEMO — 物件・ゾーン・トラップ引継ぎ</div><main class="container" id="app"></main><script src="demo-core.js"></script><script src="ui.js"></script><script>if(DPRO_UI.requireDemo()){document.getElementById('nav').innerHTML=DPRO_UI.nav();const s=DproDemo.load(),p=s.properties.find(x=>x.id==='p-shop'),tr=s.traps.filter(t=>t.propertyId===p.id);document.getElementById('app').innerHTML=`<section class="hero"><span class="badge">定期防除</span><h1>${DPRO_UI.esc(p.name)}</h1><p>${DPRO_UI.esc(p.address)}</p></section><section class="grid grid-3" style="margin-top:18px">${tr.map(t=>{const z=s.zones.find(z=>z.id===t.zoneId);const caps=s.captures.filter(c=>c.trapId===t.id);return `<div class="card"><h2>${DPRO_UI.esc(t.label)}</h2><p>${DPRO_UI.esc(z.name)} / ${DPRO_UI.esc(t.type)}</p><div class="metric">${caps.reduce((n,c)=>n+c.count,0)}</div><div class="muted">今回捕獲数</div></div>`}).join('')}</section><section class="card" style="margin-top:18px"><h2>地点管理の考え方</h2><p>図面画像そのものへ固定座標を書き込む前段として、Property → Zone → Trap IDを安定IDで管理します。図面差替え時も履歴が消えない設計です。</p></section>`;}</script></body></html>
