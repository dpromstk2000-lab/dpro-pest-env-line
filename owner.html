<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner | DPRO PEST</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar"><div class="brand">Owner Control Center</div><div id="nav"></div></div><div class="demo-banner">DEMO — tenant内全体を管理</div><main class="container" id="app"></main><script src="demo-core.js"></script><script src="ui.js"></script><script>if(DPRO_UI.requireDemo()){document.getElementById('nav').innerHTML=DPRO_UI.nav();const s=DproDemo.load(),uid='u-owner',sum=DproDemo.summary(s,uid),cases=DproDemo.visibleCases(s,uid);document.getElementById('app').innerHTML=`<section class="grid grid-3"><div class="card"><div class="muted">案件</div><div class="metric">${sum.cases}</div></div><div class="card"><div class="muted">要注意</div><div class="metric">${sum.urgent}</div></div><div class="card"><div class="muted">未完了Next Action</div><div class="metric">${sum.todayActions}</div></div></section><section class="card" style="margin-top:18px"><div class="row" style="justify-content:space-between"><h2>今日やること / 案件ボード</h2><button class="btn secondary" id="reset">デモ初期化</button></div><div class="table-wrap"><table><thead><tr><th>案件</th><th>害虫/害獣</th><th>状態</th><th>担当</th><th>次回</th><th></th></tr></thead><tbody>${cases.map(c=>`<tr><td>${DPRO_UI.esc(c.title)}</td><td>${DPRO_UI.esc(c.pest)}</td><td><span class="status ${c.urgency==='high'?'urgent':''}">${DPRO_UI.status(c.status)}</span></td><td>${DPRO_UI.esc((s.users.find(u=>u.id===c.assignedStaffId)||{}).name||'未割当')}</td><td>${DPRO_UI.fmt(c.nextVisit)}</td><td><button class="btn secondary open" data-id="${c.id}">開く</button></td></tr>`).join('')}</tbody></table></div></section><section id="detail" class="card" style="margin-top:18px"><h2>案件を選択してください</h2></section><section class="card" style="margin-top:18px"><h2>報告承認</h2><div id="reports"></div></section>`;renderReports();function renderReports(){const x=DproDemo.load(),rs=x.reports.filter(r=>r.status==='review');document.getElementById('reports').innerHTML=rs.length?rs.map(r=>`<div class="item">${DPRO_UI.esc((x.cases.find(c=>c.id===r.caseId)||{}).title||r.caseId)} <button class="btn approve" data-id="${r.id}">承認・公開</button></div>`).join(''):'確認待ち報告はありません';document.querySelectorAll('.approve').forEach(b=>b.onclick=()=>{const z=DproDemo.load();DproDemo.approveReport(z,uid,b.dataset.id);DproDemo.save(z);location.reload();});}document.getElementById('reset').onclick=()=>{DproDemo.reset();location.reload()};document.querySelectorAll('.open').forEach(b=>b.onclick=()=>show(b.dataset.id));function show(id){const st=DproDemo.load(),c=st.cases.find(x=>x.id===id),ev=st.evidence.filter(e=>e.caseId===id),acts=st.nextActions.filter(a=>a.caseId===id&&a.status==='open');document.getElementById('detail').innerHTML=`<h2>${DPRO_UI.esc(c.title)}</h2><div class="grid grid-2"><div><h3>Evidence Chain</h3><div class="timeline">${ev.map(e=>`<div class="event"><b>${DPRO_UI.esc(e.phase)}</b> ${DPRO_UI.esc(e.caption)}</div>`).join('')||'<p>まだありません</p>'}</div></div><div><h3>Next Action</h3><div class="list">${acts.map(a=>`<div class="item"><b>${DPRO_UI.esc(a.label)}</b><br>${DPRO_UI.fmt(a.dueAt)}</div>`).join('')||'<p>未生成</p>'}</div><h3>安全な状態変更</h3><div class="field"><select id="to">${(DproDemo.transitions[c.status]||[]).map(x=>`<option value="${x}">${DPRO_UI.status(x)}</option>`).join('')}</select></div><div class="field"><input id="reason" placeholder="取消/再開時は理由必須"></div><button class="btn" id="move">状態を変更</button><p id="msg"></p></div></div>`;document.getElementById('move').onclick=()=>{try{const a=DproDemo.load();DproDemo.transition(a,uid,id,document.getElementById('to').value,document.getElementById('reason').value);DproDemo.save(a);document.getElementById('msg').textContent='更新しました';setTimeout(()=>location.reload(),400)}catch(e){document.getElementById('msg').textContent='BLOCK: '+e.message}};}}</script></body></html>
