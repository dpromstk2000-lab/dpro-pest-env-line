<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>READY Control Center | DPRO PEST</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar"><div class="brand">READY Control Center</div></div><main class="container"><section class="hero"><span class="badge">G7 PREP</span><h1>本番開始前の12項目</h1><p>外部URL・Auth・LINEが確定するまでPRODUCTION READYにはしません。</p></section><section class="card" style="margin-top:18px"><div class="list" id="list"></div></section></main><script>const checks=[['System identity / version','PASS'],['Frontend / API / data binding','HOLD'],['Auth available','HOLD'],['Role settings','CORE PASS / LIVE HOLD'],['Required feature dependencies','CORE PASS'],['System Check','G4 PREDEPLOY PASS / LIVE HOLD'],['Demo / Production boundary','PASS'],['Contact / support','HOLD'],['Required public URLs reachable','HOLD'],['PC / tablet / mobile critical QA','G8 HOLD'],['Tutorial / Guide / PDF','DRAFT / QR HOLD'],['Production switch checklist','HOLD']];document.getElementById('list').innerHTML=checks.map(([n,s])=>`<div class="item"><span class="status ${s==='PASS'?'ok':s.includes('HOLD')?'warn':''}">${s}</span> ${n}</div>`).join('');</script></body></html>
