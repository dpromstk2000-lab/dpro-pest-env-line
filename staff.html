<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff | DPRO PEST</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar"><div class="brand">Staff Field</div><div id="nav"></div></div><div class="demo-banner">DEMO — 割当案件だけを表示・記録</div><main class="container" id="app"></main><script src="demo-core.js"></script><script src="ui.js"></script><script>if(DPRO_UI.requireDemo()){document.getElementById('nav').innerHTML=DPRO_UI.nav();const uid=new URLSearchParams(location.search).get('staff')==='a'?'u-staff-a':'u-staff-b',s=DproDemo.load(),cases=DproDemo.visibleCases(s,uid);document.getElementById('app').innerHTML=`<section class="hero"><span class="badge">${DPRO_UI.esc(DproDemo.actor(s,uid).name)}</span><h1>本日の担当</h1><p>他スタッフの未割当案件は表示しません。</p></section><section class="grid grid-2" style="margin-top:18px">${cases.map(c=>`<div class="card"><h2>${DPRO_UI.esc(c.title)}</h2><p><span class="status">${DPRO_UI.status(c.status)}</span> ${DPRO_UI.fmt(c.nextVisit)}</p><button class="btn open" data-id="${c.id}">現場カルテを開く</button></div>`).join('')||'<div class="card">担当案件はありません</div>'}</section><section class="card" id="detail" style="margin-top:18px"><h2>案件を選択してください</h2></section>`;document.querySelectorAll('.open').forEach(b=>b.onclick=()=>show(b.dataset.id));function show(id){const st=DproDemo.load(),c=st.cases.find(x=>x.id===id),ev=st.evidence.filter(e=>e.caseId===id);document.getElementById('detail').innerHTML=`<h2>${DPRO_UI.esc(c.title)}</h2><div class="grid grid-2"><div><h3>Evidence Chain追加</h3><div class="field"><select id="phase"><option>survey</option><option>before</option><option>during</option><option>after</option><option>result</option></select></div><div class="field"><input id="cap" placeholder="写真/所見メモ"></div><div class="row"><button class="btn secondary" id="draft">オフライン下書き保存</button><button class="btn" id="evadd">記録を追加</button></div><h3>薬剤記録</h3><div class="field"><input id="prod" placeholder="製品名"></div><div class="field"><input id="purpose" placeholder="使用目的"></div><div class="row"><input id="amount" placeholder="量" style="padding:10px;border:1px solid #ccc;border-radius:9px;width:110px"><input id="unit" placeholder="単位" style="padding:10px;border:1px solid #ccc;border-radius:9px;width:110px"></div><label><input type="checkbox" id="labelok"> ラベル/事業者基準を確認した</label><br><br><button class="btn secondary" id="chem">薬剤記録を追加</button><h3>安全確認</h3><label><input type="checkbox" id="riskok"> 現場リスク/周囲への配慮事項を確認した</label><br><br><button class="btn secondary" id="safety">安全確認を記録</button><h3>報告書</h3><button class="btn secondary" id="report">Before/Afterから報告書を作成</button><p id="msg"></p></div><div><h3>現在の記録</h3><div class="timeline">${ev.map(e=>`<div class="event"><b>${DPRO_UI.esc(e.phase)}</b><div>${DPRO_UI.esc(e.caption)}</div></div>`).join('')}</div></div></div>`;const dr=DproDemo.loadDraft(st,uid,id);if(dr){document.getElementById('cap').value=dr.caption||'';document.getElementById('phase').value=dr.phase||'survey';}document.getElementById('draft').onclick=()=>{const a=DproDemo.load();DproDemo.saveDraft(a,uid,id,{phase:document.getElementById('phase').value,caption:document.getElementById('cap').value});DproDemo.save(a);document.getElementById('msg').textContent='端末内に下書きを保存しました';};document.getElementById('evadd').onclick=()=>{try{const a=DproDemo.load();DproDemo.addEvidence(a,uid,id,{phase:document.getElementById('phase').value,caption:document.getElementById('cap').value||'現場写真（デモ）'});DproDemo.save(a);show(id)}catch(e){document.getElementById('msg').textContent='BLOCK: '+e.message}};document.getElementById('safety').onclick=()=>{try{const a=DproDemo.load();DproDemo.addSafetyCheckpoint(a,uid,id,{type:'site_risk',confirmed:document.getElementById('riskok').checked,note:'現場確認（デモ）'});DproDemo.save(a);document.getElementById('msg').textContent='安全確認を記録しました'}catch(e){document.getElementById('msg').textContent='BLOCK: '+e.message}};document.getElementById('report').onclick=()=>{try{const a=DproDemo.load();const r=DproDemo.buildReport(a,uid,id);DproDemo.save(a);document.getElementById('msg').textContent='報告書をOwner確認待ちにしました: '+r.id}catch(e){document.getElementById('msg').textContent='BLOCK: '+e.message}};document.getElementById('chem').onclick=()=>{try{const a=DproDemo.load();DproDemo.addChemical(a,uid,id,{productName:document.getElementById('prod').value,purpose:document.getElementById('purpose').value,amount:document.getElementById('amount').value,unit:document.getElementById('unit').value,confirmedLabel:document.getElementById('labelok').checked});DproDemo.save(a);document.getElementById('msg').textContent='薬剤記録を保存しました（安全性/適法性を自動保証するものではありません）'}catch(e){document.getElementById('msg').textContent='BLOCK: '+e.message}};}}</script></body></html>
