<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Check | DPRO PEST</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar"><div class="brand">System Check</div><div id="nav"></div></div><div id="mode-banner" class="demo-banner"></div><main class="container"><section class="hero"><h1>System Check</h1><p>DEMOではローカルの分離・Role/State契約を、本番ではWorker・Supabase・Production Guard・Data API binding・Evidence Storageを一括確認します。</p></section><section class="card" style="margin-top:18px"><button class="btn" id="run">一括チェック</button><div id="results" class="list" style="margin-top:14px"></div></section></main><script src="config.js"></script><script src="demo-core.js"></script><script src="ui.js"></script><script>
const results=document.getElementById('results');document.getElementById('nav').innerHTML=DPRO_UI.nav();DPRO_UI.setModeBanner('営業前チェック');
function render(checks,headline,details=''){results.innerHTML=`<div class="item"><span class="status ${checks.every(([,p])=>p)?'ok':'urgent'}">${checks.every(([,p])=>p)?'PASS':'BLOCK'}</span> <b>${DPRO_UI.esc(headline)}</b>${details?`<div class="muted" style="margin-top:6px">${DPRO_UI.esc(details)}</div>`:''}</div>`+checks.map(([n,p])=>`<div class="item"><span class="status ${p?'ok':'urgent'}">${p?'PASS':'BLOCK'}</span> ${DPRO_UI.esc(n)}</div>`).join('')}
async function run(){results.innerHTML='<div class="item">確認中…</div>';if(DPRO_UI.demo){const s=DproDemo.load(),checks=[['DEMO分離',s.meta.mode==='DEMO'],['住宅デモ案件',!!s.cases.find(c=>c.id==='case-home')],['定期防除デモ案件',!!s.cases.find(c=>c.id==='case-shop')],['Customer scope',DproDemo.visibleCases(s,'u-customer-home').every(c=>c.customerId==='c-home')],['Staff assignment scope',DproDemo.visibleCases(s,'u-staff-a').every(c=>c.assignedStaffId==='u-staff-a')],['Owner tenant scope',DproDemo.visibleCases(s,'u-owner').every(c=>c.tenantId==='tenant-demo')],['State contract',Array.isArray(DproDemo.transitions.in_progress)],['Production設定とDEMOの分離',window.DPRO_CONFIG.productionConfigured===true&&!!window.DPRO_CONFIG.apiBase]];render(checks,'DEMO System Check');return}try{const j=await DPRO_UI.api('/api/pest/v1/system-check');const labels={environment:'Environment',supabase_url:'Supabase URL',auth_api_key:'Auth API key',service_role_secret:'Service role secret',schema:'専用schema',default_tenant:'Production tenant',allowed_origins:'CORS origin',demo_production_guard:'Demo / Production Guard',line_binding:'LINE binding',custom_schema_data_api:'Custom schema Data API',evidence_storage:'Evidence Storage'};const checks=Object.entries(j.checks||{}).map(([k,v])=>[labels[k]||k,!!v]);render(checks,j.ok?'Production System Check OK':'Production System Check BLOCK',`schema=${j.details?.schema||'-'} / schema_api_error=${j.details?.schema_api_error||'none'} / evidence_bucket=${j.details?.evidence_bucket||'-'} / storage_error=${j.details?.storage_error||'none'}`)}catch(e){render([['Worker / API接続',false]],'Production System Check ERROR',DPRO_UI.errText(e))}}
document.getElementById('run').onclick=run;run();
</script></body></html>
