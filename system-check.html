<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Check | DPRO PEST</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar"><div class="brand">System Check</div><div id="nav"></div></div><div class="demo-banner">DEMO — 営業前チェック</div><main class="container"><section class="hero"><h1>System Check</h1><p>G4ではデモ境界・必須データ・Role/State契約をローカル検査します。本番URL/Auth/LINE webhookはREADY段階でblocking checkへ追加します。</p></section><section class="card" style="margin-top:18px"><button class="btn" id="run">一括チェック</button><div id="results" class="list" style="margin-top:14px"></div></section></main><script src="config.js"></script><script src="demo-core.js"></script><script src="ui.js"></script><script>document.getElementById('nav').innerHTML=DPRO_UI.nav();document.getElementById('run').onclick=()=>{const s=DproDemo.load(),checks=[['DEMO分離',s.meta.mode==='DEMO'],['住宅デモ案件',!!s.cases.find(c=>c.id==='case-home')],['定期防除デモ案件',!!s.cases.find(c=>c.id==='case-shop')],['Customer scope',DproDemo.visibleCases(s,'u-customer-home').every(c=>c.customerId==='c-home')],['Staff assignment scope',DproDemo.visibleCases(s,'u-staff-a').every(c=>c.assignedStaffId==='u-staff-a')],['Owner tenant scope',DproDemo.visibleCases(s,'u-owner').every(c=>c.tenantId==='tenant-demo')],['State contract',Array.isArray(DproDemo.transitions.in_progress)],['本番接続未設定',window.DPRO_CONFIG.productionConfigured===false]];document.getElementById('results').innerHTML=checks.map(([n,p])=>`<div class="item"><span class="status ${p?'ok':'urgent'}">${p?'PASS':'BLOCK'}</span> ${n}</div>`).join('');};document.getElementById('run').click();</script></body></html>
