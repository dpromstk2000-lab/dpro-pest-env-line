<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutorial | DPRO PEST</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar"><div class="brand">Tutorial</div><div id="nav"></div></div><main class="container"><section class="hero"><span class="badge">First Run</span><h1>最初の10分で流れをつかむ</h1><p>受付 → 現場カルテ → 報告 → 次回行動の順に体験します。デモデータはいつでも初期化できます。</p><div class="row"><button class="btn" id="start">開始 / 続きから</button><button class="btn secondary" id="replay">最初から</button></div></section><section class="card" style="margin-top:18px"><div id="progress"></div><div id="step"></div></section></main><script src="ui.js"></script><script>document.getElementById('nav').innerHTML=DPRO_UI.nav();const K='dpro_pest_tutorial_step';const steps=[['1. デモ準備','Demo Prepareで住宅単発と飲食店定期の2案件を準備します。','demo-prepare.html?demo=1'],['2. Customer受付','顧客本人の案件だけが見えること、相談情報を追加できることを確認します。','customer.html?demo=1'],['3. Staff現場カルテ','割当案件だけを開き、Before/After、薬剤確認、安全確認を記録します。','staff.html?demo=1'],['4. Owner管理','案件状態、報告承認、Next Actionを確認します。','owner.html?demo=1'],['5. 定期物件','Property / Zone / Trapの引継ぎ単位をiPad画面で確認します。','owner-ipad.html?demo=1'],['6. System Check','営業前にデモ境界とRole/State契約を一括確認します。','system-check.html?demo=1']];function render(){let i=Number(localStorage.getItem(K)||0);i=Math.max(0,Math.min(i,steps.length-1));document.getElementById('progress').innerHTML=`<p><b>${i+1}/${steps.length}</b></p>`;const s=steps[i];document.getElementById('step').innerHTML=`<h2>${s[0]}</h2><p>${s[1]}</p><div class="row"><a class="btn" href="${s[2]}">この画面を開く</a><button class="btn secondary" id="next">完了して次へ</button></div>`;document.getElementById('next').onclick=()=>{localStorage.setItem(K,String(Math.min(i+1,steps.length-1)));render()};}document.getElementById('start').onclick=render;document.getElementById('replay').onclick=()=>{localStorage.setItem(K,'0');render()};render();</script></body></html>
