<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutorial | DPRO PEST</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar"><div class="brand">Tutorial</div><div id="nav"></div></div><main class="container"><section class="hero"><span class="badge">First Run / G8</span><h1>最初の10分で流れをつかむ</h1><p>受付 → 顧客 → 現場カルテ → Owner管理 → 定期物件 → System Check → READYの順に体験します。DEMOは本番データへ書き込みません。</p><div class="row"><button class="btn" id="start">開始 / 続きから</button><button class="btn secondary" id="replay">最初から</button></div></section><section class="card" style="margin-top:18px"><div id="progress"></div><div id="step"></div></section><section class="notice" style="margin-top:18px"><b>Production機能:</b> WEB実ファイル受付、Owner受付BOX→案件化、Private Storage、Field Map PIN、Session RefreshはG7実機QA済みです。営業DEMOでは実顧客データを入力しません。</section></main><script src="ui.js"></script><script>document.getElementById('nav').innerHTML=DPRO_UI.nav();const K='dpro_pest_tutorial_step_g8';const steps=[['1. デモ準備','Demo Prepareで住宅単発と飲食店定期の2案件を準備します。','demo-prepare.html?demo=1'],['2. 相談受付','WEB相談フォームの入力項目と安全確認をDEMOで確認します。本番送信は行いません。','inquiry.html?demo=1'],['3. Customer','本人案件だけが見えること、相談情報を追加できることを確認します。','customer.html?demo=1'],['4. Staff現場カルテ','割当案件だけを開き、Before/After、薬剤確認、安全確認を記録します。','staff.html?demo=1'],['5. Owner管理','案件状態、報告承認、Next Actionを確認します。','owner.html?demo=1'],['6. 定期物件 / Field Map','Property / Zone / Trapの引継ぎ単位をiPad画面で確認します。','owner-ipad.html?demo=1'],['7. System Check / READY','営業前チェックと、標準製品READY・契約後入力の分離を確認します。','system-check.html?demo=1']];function render(){let i=Number(localStorage.getItem(K)||0);i=Math.max(0,Math.min(i,steps.length-1));document.getElementById('progress').innerHTML=`<p><b>${i+1}/${steps.length}</b></p>`;const s=steps[i];document.getElementById('step').innerHTML=`<h2>${s[0]}</h2><p>${s[1]}</p><div class="row"><a class="btn" href="${s[2]}">この画面を開く</a><button class="btn secondary" id="next">完了して次へ</button></div>`;document.getElementById('next').onclick=()=>{localStorage.setItem(K,String(Math.min(i+1,steps.length-1)));render()};}document.getElementById('start').onclick=render;document.getElementById('replay').onclick=()=>{localStorage.setItem(K,'0');render()};render();</script></body></html>
